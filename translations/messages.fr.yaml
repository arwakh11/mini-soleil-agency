legal:
  title: "Mentions légales"
  updated: "Dernière mise à jour : 15 octobre 2026"
  sections:
    publisher:
      title: "Éditeur du site"
      content: |-
        Dénomination sociale : [à compléter]
        Forme juridique : [à compléter]
        Siège social : [adresse complète]
        SIREN / SIRET : [à compléter]
        Directeur de la publication : [nom]
        Contact : [adresse e-mail professionnelle]
    hosting:
      title: "Hébergement"
      content: |-
        Le site est actuellement en développement dans un environnement local.
        Lors de sa mise en ligne, les coordonnées de l'hébergeur seront indiquées ici.
    intellectual_property:
      title: "Propriété intellectuelle"
      content: |-
        Les textes, photographies, graphismes, logos et autres éléments du site sont protégés par les règles applicables en matière de propriété intellectuelle. Toute utilisation non autorisée est interdite, sous réserve des exceptions légales et des droits des tiers.
    liability:
      title: "Responsabilité"
      content: |-
        Mini Soleil s'efforce de maintenir les informations du site exactes et à jour. Des erreurs ou omissions peuvent toutefois survenir.
    personal_data:
      title: "Données personnelles"
      content: |-
        Les données transmises via le formulaire de demande de devis sont utilisées pour étudier et gérer les demandes et communiquer avec les personnes concernées.
        Responsable du traitement : [identité légale]
        Contact pour les données personnelles : [adresse e-mail]
        Base légale, durée de conservation, destinataires et modalités d'exercice des droits : [à préciser selon le traitement réel].
        Vous pouvez également introduire une réclamation auprès de la CNIL.
    cookies:
      title: "Cookies et traceurs"
      content: |-
        Le site n'intègre actuellement aucun outil d'analyse d'audience ni de suivi publicitaire, selon la configuration connue du projet. Les cookies et services réellement utilisés devront être vérifiés avant la mise en ligne.
    law:
      title: "Droit applicable"
      content: |-
        Les présentes mentions légales sont soumises au droit français, sous réserve des règles impératives applicables.
        
  intro: "Informations légales concernant Mini Soleil et l’utilisation de ce site."
  footer: "Création avec soin."