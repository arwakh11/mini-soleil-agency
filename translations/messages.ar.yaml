home:
    page_title: "ميني سولاي — وكالة إنتاج إبداعي"

    hero:
        eyebrow: "نوصلكم بأفضل"
        title:
            first_line:
                "المواهب"
            accent:
                "المميزة"
            second_line:
                "في أوروبا"
        description: |
            لنحوّل رؤيتكم إلى واقع،
            بكل سلاسة وأناقة.
        cta: "احجزوا جلسة التصوير ←"
        editorial: "الإخراج الإبداعي • التصوير • تصوير الفيديو • التنسيق • UGC"
        image_alt: "الإنتاج الإبداعي من ميني سولاي"

    introduction:
        text: |
            ميني سولاي هي وكالة إنتاج إبداعي
            تصنع تجارب بصرية راقية
            للعلامات التجارية الطموحة.
        image_alt: "إنتاج إبداعي"

    create_more:
        title: |
            نصنع
            أكثر
            من
            مجرد
            محتوى.
        description: |
            من الفكرة إلى التسليم النهائي،
            نجمع أفضل المواهب الإبداعية في أوروبا
            لإنتاج صور ومحتوى بصري
            أصيل وراقٍ وفعّال تجارياً.
        image_alt: "تصوير إبداعي"

    why_choose_us:
        eyebrow: "كل ما تحتاجه علامتك التجارية"
        title: "لماذا تختاروننا؟"

        save_time:
            title: |
                وفّروا
                وقتكم
            description: |
                من التخطيط الإبداعي ولوحات الإلهام
                إلى الإنتاج والتنسيق والتصوير والمونتاج،
                ندير العملية بالكامل لتتمكنوا
                من التركيز على أعمالكم.
            image_alt: "وفّروا وقتكم مع ميني سولاي"

        global_quality:
            title: |
                جودة
                عالمية
            description: |
                احصلوا على أفضل المواهب الإبداعية
                في أوروبا دون قضاء أشهر
                في البحث عن الفريق المناسب.
            image_alt: "مواهب إبداعية أوروبية"

        built_to_convert:
            title: |
                مصمم
                لتحقيق
                النتائج
            description: |
                الصور الجميلة ليست سوى جزء
                من المعادلة. كل صورة وكل فيديو
                مصممان للتعبير عن علامتكم التجارية
                والتأثير في جمهوركم.
            image_alt: "محتوى مصمم لتحقيق النتائج"

    final_cta:
        eyebrow: "إنتاجكم القادم يبدأ من هنا"
        title: |
            هل أنتم
            مستعدون
            للارتقاء
            بعلامتكم
            التجارية؟
        description: |
            لنصنع معاً محتوى بصرياً
            يجعل علامتكم لا تُنسى.
        cta: "احجزوا مشروعكم"
        arrow:  "←"
        image_alt: "إنتاج ميني سولاي"



