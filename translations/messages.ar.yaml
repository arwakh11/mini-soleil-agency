legal:
  title: "الإشعارات القانونية"
  updated: "آخر تحديث: 15 أكتوبر 2026"
  sections:
    publisher:
      title: "الجهة الناشرة للموقع"
      content: |-
        الاسم القانوني للشركة: [يُستكمل]
        الشكل القانوني: [يُستكمل]
        المقر الرئيسي: [العنوان الكامل]
        رقما SIREN / SIRET: [يُستكملان]
        مسؤول النشر: [الاسم]
        البريد الإلكتروني للتواصل: [البريد المهني]
    hosting:
      title: "استضافة الموقع"
      content: |-
        الموقع قيد التطوير حاليًا ضمن بيئة محلية. ستُضاف بيانات شركة الاستضافة عند نشر الموقع على الإنترنت.
    intellectual_property:
      title: "الملكية الفكرية"
      content: |-
        تخضع النصوص والصور والرسومات والشعارات وغيرها من محتويات الموقع لقوانين الملكية الفكرية المعمول بها. يُحظر استخدامها دون إذن، مع مراعاة الاستثناءات القانونية وحقوق الغير.
    liability:
      title: "المسؤولية"
      content: |-
        تسعى Mini Soleil إلى تقديم معلومات دقيقة ومحدّثة على الموقع، إلا أنه قد تحدث أخطاء أو سهو.
    personal_data:
      title: "البيانات الشخصية"
      content: |-
        تُستخدم البيانات المقدّمة عبر نموذج طلب عرض السعر لدراسة الطلبات وإدارتها والتواصل مع أصحابها.
        المسؤول عن معالجة البيانات: [الهوية القانونية]
        للتواصل بشأن البيانات الشخصية: [البريد الإلكتروني]
        الأساس القانوني ومدة الاحتفاظ بالبيانات والجهات التي يمكنها الوصول إليها وكيفية ممارسة الحقوق: [تُستكمل وفق المعالجة الفعلية].
        يمكن أيضًا تقديم شكوى إلى الهيئة الفرنسية لحماية البيانات CNIL.
    cookies:
      title: "ملفات تعريف الارتباط وأدوات التتبع"
      content: |-
        وفقًا للإعدادات المعروفة حاليًا للمشروع، لا يستخدم الموقع أدوات تحليل الزيارات أو التتبع الإعلاني. يجب التحقق من ملفات تعريف الارتباط والخدمات المستخدمة فعليًا قبل الإطلاق.
    law:
      title: "القانون المعمول به"
      content: |-
        تخضع هذه الإشعارات القانونية للقانون الفرنسي، مع مراعاة القواعد الإلزامية واجبة التطبيق.

  intro: "المعلومات القانونية المتعلقة بـ Mini Soleil واستخدام هذا الموقع."
  footer: "إبداع بعناية."