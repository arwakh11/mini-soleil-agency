home:
    page_title: "Mini Soleil — Agence de production créative"

    hero:
        eyebrow: "Nous vous connectons aux"
        title:
            first_line:
                "meilleurs"
            accent:
                "talents"
            second_line:
                "d'Europe"
        description: |
            Pour donner vie à votre vision,
            avec simplicité et élégance.
        cta: "Réserver votre shooting →"
        editorial: "Direction artistique • Photographie • Vidéographie • Stylisme • UGC"
        image_alt: "Production créative Mini Soleil"

    introduction:
        text: |
            Mini Soleil est une agence de production
            créative qui imagine des expériences
            visuelles premium pour les marques ambitieuses.
        image_alt: "Production créative"

    create_more:
        title: |
            Nous
            créons
            plus que
            du
            contenu.
        description: |
            Du concept à la livraison finale,
            nous réunissons les talents créatifs
            d'Europe pour produire des images
            authentiques, premium et
            commercialement percutantes.
        image_alt: "Photographie créative"

    why_choose_us:
        eyebrow: "Tout ce dont votre marque a besoin"
        title: "Pourquoi nous choisir ?"

        save_time:
            title: |
                Gagnez
                du temps
            description: |
                De la direction créative et des moodboards
                à la production, au stylisme, à la photographie
                et au montage, nous gérons l'ensemble
                du processus pour vous permettre de
                vous concentrer sur votre activité.
            image_alt: "Gagnez du temps avec Mini Soleil"

        global_quality:
            title: |
                Une qualité
                internationale
            description: |
                Accédez aux meilleurs professionnels
                créatifs d'Europe sans passer
                des mois à trouver la bonne équipe.
            image_alt: "Talents créatifs européens"

        built_to_convert:
            title: |
                Pensé
                pour
                convertir
            description: |
                De belles images ne sont qu'une partie
                de l'équation. Chaque image et chaque vidéo
                sont conçues pour transmettre votre marque
                et engager votre audience.
            image_alt: "Contenu conçu pour convertir"

    final_cta:
        eyebrow: "Votre prochaine production commence ici"
        title: |
            Prête
            à
            faire rayonner
            votre
            marque ?
        description: |
            Créons des visuels qui rendent
            votre marque inoubliable.
        cta: "Réserver votre projet"
        arrow:  "→"
        image_alt: "Production Mini Soleil"


